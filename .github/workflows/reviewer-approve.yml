name: reviewer-approve

# The reviewer app has no webhook events, so GitHub never asks it to review.
# This job approves the latest push as klaillton-gauntlet-reviewer.
# pull_request_target runs the workflow from the default branch and does not
# check out the PR head. The app key stays in the Actions secret.

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: reviewer-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Klaillton'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve the latest push
        env:
          APP_ID: ${{ vars.GAUNTLET_REVIEWER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GAUNTLET_REVIEWER_PRIVATE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import base64, json, os, subprocess, urllib.error, urllib.request
          from pathlib import Path

          def b64(data: bytes) -> bytes:
              return base64.urlsafe_b64encode(data).rstrip(b"=")

          def call(method: str, url: str, token: str, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "klaillton-gauntlet-reviewer",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  print("HTTP", exc.code)
                  raise SystemExit(1)

          key_path = Path("/tmp/reviewer-app.pem")
          key_path.write_text(os.environ["APP_PRIVATE_KEY"])
          key_path.chmod(0o600)
          now = int(__import__("time").time())
          header = b64(json.dumps({"alg": "RS256", "typ": "JWT"}, separators=(",", ":")).encode())
          payload = b64(json.dumps(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["APP_ID"]},
              separators=(",", ":"),
          ).encode())
          signing = header + b"." + payload
          sig = subprocess.check_output(
              ["openssl", "dgst", "-sha256", "-sign", str(key_path)],
              input=signing,
          )
          key_path.unlink()
          app_jwt = (signing + b"." + b64(sig)).decode()
          repo = os.environ["REPO"]
          installation = call(
              "GET",
              f"https://api.github.com/repos/{repo}/installation",
              app_jwt,
          )
          access = call(
              "POST",
              f"https://api.github.com/app/installations/{installation['id']}/access_tokens",
              app_jwt,
              {},
          )
          review = call(
              "POST",
              f"https://api.github.com/repos/{repo}/pulls/{os.environ['PR_NUMBER']}/reviews",
              access["token"],
              {
                  "commit_id": os.environ["HEAD_SHA"],
                  "event": "APPROVE",
                  "body": "Approved by klaillton-gauntlet-reviewer.",
              },
          )
          print((review.get("user") or {}).get("login"), review.get("state"))
          PY
