name: pr-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # CrapGate runs `git diff origin/main...HEAD`. Depth 1 has no base ref.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker obrigatório (fail-closed, Testcontainers)
        run: docker info
      - name: API Docker para o Testcontainers 1.21
        run: printf 'api.version=1.44\n' >> "$HOME/.docker-java.properties"
      - name: Build e testes
        run: ./mvnw -B -ntp verify
